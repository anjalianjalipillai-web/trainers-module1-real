<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI for Smart Explorers · Module 1</title>
<style>
:root{
  color-scheme: light;
  --bg1:#F0ECFF; --bg2:#FFF0E4; --panel:#FFFFFF;
  --ink:#1F2245; --ink2:#4A4E70; --muted:#666A88; --line:#E3DEF4;
  --indigo:#4B3FD1; --indigo-soft:#ECE9FF;
  --coral:#C24A2C; --coral-soft:#FFE9E0;
  --teal:#0E7570; --teal-soft:#E1F4F2;
  --gold:#9A6512; --gold-soft:#FFF3D9;
  --ok:#1E7A45; --ok-soft:#E3F5EA; --no:#B3364A; --no-soft:#FCE6EA;
  --r:22px; --shadow:0 14px 40px rgba(46,38,120,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:1.5;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1) 0%,#F6F0FF 40%,var(--bg2) 100%) fixed;min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
h1,h2,h3{line-height:1.15;margin:0}
p{margin:0}


/* course welcome page */
.hello{position:relative;overflow:hidden;border-radius:36px;padding:clamp(24px,4vw,48px);
  background:radial-gradient(120% 90% at 85% 15%,#E3DCFF 0%,rgba(227,220,255,0) 55%),radial-gradient(90% 80% at 0% 100%,#FFE0CC 0%,rgba(255,224,204,0) 60%),linear-gradient(135deg,#FFFFFF,#F7F3FF 55%,#FFF5EE);
  box-shadow:0 30px 80px rgba(46,38,120,.18);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.hello>*{position:relative;z-index:1;min-width:0}
.hello .wel{font-size:clamp(22px,2.6vw,30px);font-weight:700;color:var(--coral);letter-spacing:.02em}
.hello h1{font-size:clamp(36px,4.6vw,62px);line-height:1.04;margin:8px 0 16px;color:var(--ink)}
.hello h1 em{font-style:normal;background:linear-gradient(120deg,#4B3FD1,#8A5CF0 50%,#E0683F);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello .sub{font-size:clamp(19px,2.2vw,24px);color:var(--ink2)}
.ticks{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 28px}
.ticks span{display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(46,38,120,.08)}
.ticks span::before{content:"✓";color:#fff;background:var(--teal);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.scene{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;justify-self:center}
.scene .globe{position:absolute;inset:6% 4% 14% 14%;animation:bob 6s ease-in-out infinite}
.scene .globe svg{width:100%;height:100%;overflow:visible}
.meri{transform-origin:200px 200px;animation:meri 6s linear infinite}
.meri:nth-of-type(2){animation-delay:-2s}.meri:nth-of-type(3){animation-delay:-4s}
@keyframes meri{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.pulse:nth-child(2n){animation-delay:-1.2s}
@keyframes pulse{0%,100%{opacity:1;r:7}50%{opacity:.55;r:10}}
.scene .nv{position:absolute;left:-2%;bottom:0;width:44%;z-index:2}
.gcard{position:absolute;z-index:3;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:10px 14px;font-weight:700;font-size:15px;box-shadow:0 16px 34px rgba(46,38,120,.16);animation:card 5s ease-in-out infinite;transform:perspective(500px) rotateY(-12deg)}
.gcard i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--b)}
.gcard.c3{left:4%;top:4%;animation-delay:-3.2s}.gcard.c1{right:0;top:20%}.gcard.c2{right:0;top:62%;animation-delay:-1.6s}
@keyframes card{0%,100%{translate:0 0}50%{translate:0 -12px}}
.flag{display:inline-flex;height:10px;width:30px;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
.flag b{flex:1}
@media (max-width:900px){.hello{grid-template-columns:1fr}.scene{order:-1;max-width:340px}}
@media (max-width:480px){.gcard{font-size:13px;padding:7px 10px}.gcard i{width:28px;height:28px;font-size:15px}}


/* celebration */
.party{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 0%,#FFFFFF 0%,rgba(255,255,255,0) 70%),linear-gradient(160deg,#EEE8FF 0%,#F8F0FF 45%,#FFE9DB 100%)}
.party .ptop{text-align:center;padding:clamp(18px,4vh,40px) 16px 0;position:relative;z-index:3}
.party h1{font-size:clamp(34px,6.4vw,86px);line-height:1.02;margin:0;background:linear-gradient(120deg,#4B3FD1,#9B5CF0 45%,#E0683F 80%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:popin .9s cubic-bezier(.2,1.6,.4,1) both .3s}
.party .ps{font-size:clamp(17px,2vw,22px);font-weight:700;color:var(--ink2);margin-top:10px;animation:popin .8s ease both .9s}
@keyframes popin{0%{opacity:0;transform:scale(.4) translateY(30px)}100%{opacity:1;transform:none}}
.party .pstage{position:relative;min-height:0;display:grid;place-items:end center}
.party svg.crowd{width:min(1100px,100%);height:100%;max-height:62vh}
.party .pbar{display:flex;gap:12px;justify-content:center;padding:14px 16px 22px;position:relative;z-index:3}
.hop{animation:hop 1s cubic-bezier(.3,0,.4,1) infinite}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-46px)}55%{transform:translateY(-46px)}}
.arm{animation:wave .45s ease-in-out infinite alternate}
.arm.r{animation-direction:alternate-reverse}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.leg{animation:kick 1s ease-in-out infinite}
@keyframes kick{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.leg.r{animation-name:kickr}
@keyframes kickr{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.boom{transform-box:fill-box;transform-origin:center;animation:boom 2.2s ease-out infinite}
@keyframes boom{0%{transform:scale(.1);opacity:0}15%{opacity:1}80%{transform:scale(1);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.balloon{animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-900px)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.flagwave{transform-box:fill-box;transform-origin:left center;animation:flagw 1.2s ease-in-out infinite alternate}
@keyframes flagw{from{transform:skewY(-4deg) scaleX(1)}to{transform:skewY(4deg) scaleX(.94)}}
.pconf i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
.pconf{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}


.enter{animation:enter 2.2s cubic-bezier(.25,.8,.3,1) both}
@keyframes enter{from{transform:translateX(var(--from))}to{transform:translateX(0)}}
.drop{animation:drop2 1.3s cubic-bezier(.3,1.5,.5,1) both 1.4s}
@keyframes drop2{from{transform:translateY(-520px)}to{transform:translateY(0)}}
.rise{transform-box:fill-box;transform-origin:bottom center;animation:riseup .9s cubic-bezier(.3,1.5,.5,1) both 2.2s}
@keyframes riseup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
svg.crowd{animation:cam 3.4s ease-out both}
@keyframes cam{from{transform:scale(1.18) translateY(30px)}to{transform:none}}
.party .ptop h1{animation-delay:2.4s}.party .ps{animation-delay:3s}
.pconf i{animation-name:fall;opacity:0;animation-fill-mode:backwards}
.party.paused *, .party.paused *::before, .party.paused *::after{animation-play-state:paused!important}
.player{display:flex;align-items:center;gap:12px;width:min(720px,100%);margin:0 auto;background:rgba(255,255,255,.85);border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(46,38,120,.15)}
.player button{flex:none;border:0;background:var(--indigo);color:#fff;width:42px;height:42px;border-radius:12px;font-size:18px;font-weight:700}
.player .track{flex:1;height:8px;border-radius:999px;background:#E6E1FA;overflow:hidden}
.player .track b{display:block;height:100%;width:0;background:linear-gradient(90deg,#7C70F0,#E0683F)}
.player .tm{font-size:14px;font-weight:700;color:var(--muted);min-width:78px;text-align:right}
.party .pbar{flex-direction:column;align-items:center}
.party .pbar .row{justify-content:center}


/* dancing Nova */
.nL{animation:nL 2.6s ease-in-out infinite}
@keyframes nL{0%,100%{transform:rotate(150deg)}20%{transform:rotate(170deg)}40%{transform:rotate(55deg)}60%{transform:rotate(150deg)}80%{transform:rotate(105deg)}}
.nLf{animation:nLf 2.6s ease-in-out infinite}
@keyframes nLf{0%,100%{transform:rotate(0)}20%{transform:rotate(35deg)}40%{transform:rotate(-95deg)}60%{transform:rotate(0)}80%{transform:rotate(45deg)}}
.nR{animation:nR 2.6s ease-in-out infinite}
@keyframes nR{0%,100%{transform:rotate(-150deg)}20%{transform:rotate(-55deg)}40%{transform:rotate(-170deg)}60%{transform:rotate(-115deg)}80%{transform:rotate(-160deg)}}
.nRf{animation:nRf .42s ease-in-out infinite alternate}
@keyframes nRf{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
.nHead{animation:nHead 2.6s ease-in-out infinite}
@keyframes nHead{0%,100%{transform:rotate(0)}25%{transform:rotate(-11deg)}50%{transform:rotate(3deg)}75%{transform:rotate(11deg)}}
.nBlink{transform-box:fill-box;transform-origin:center;animation:nBlink 3.2s infinite}
@keyframes nBlink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.nTwirl{animation:nTwirl 6s ease-in-out infinite 3.4s}
@keyframes nTwirl{0%,62%,100%{transform:scaleX(1)}70%{transform:scaleX(.08)}76%,86%{transform:scaleX(-1)}94%{transform:scaleX(.08)}}
.nBody{animation:nBody 1s ease-in-out infinite}
@keyframes nBody{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.nGlow{animation:nGlow 1.6s ease-in-out infinite alternate}
@keyframes nGlow{from{opacity:.55}to{opacity:1}}

/* floating 3D orbs */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;animation:float 14s ease-in-out infinite}
.orbs i:nth-child(1){width:180px;height:180px;left:-50px;top:18%;background:radial-gradient(circle at 32% 28%,#fff,#CFC6FF 42%,#8E7EF0);opacity:.55}
.orbs i:nth-child(2){width:120px;height:120px;right:-30px;top:44%;background:radial-gradient(circle at 32% 28%,#fff,#FFD6BF 42%,#F29A72);opacity:.55;animation-delay:-4s}
.orbs i:nth-child(3){width:60px;height:60px;right:14%;top:13%;background:radial-gradient(circle at 32% 28%,#fff,#FFE7A8 45%,#E6B64A);opacity:.7;animation-delay:-7s}
.orbs i:nth-child(4){width:140px;height:140px;left:8%;bottom:-50px;background:radial-gradient(circle at 32% 28%,#fff,#BDEBE5 42%,#5FBDB2);opacity:.45;animation-delay:-2s}
.orbs i:nth-child(5){width:90px;height:90px;right:6%;bottom:6%;background:radial-gradient(circle at 32% 28%,#fff,#D9D2FF 42%,#9A8CF2);opacity:.5;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-26px,0)}}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 20px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{font-size:15px;font-weight:700;color:var(--teal)}
.prog{font-size:14px;color:var(--muted)}
.brandbox{display:flex;flex-direction:column}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1 1 100%;padding:2px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip[aria-current="step"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.done{border-color:#BFE3CD;color:var(--ok)}
.chip.done::before{content:"✓ "}
.tbtn{margin-left:auto;border:1.5px solid var(--gold);background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700}

/* stage */
main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
#stage{animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);border:1px solid rgba(227,222,244,.8);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:grid;gap:20px}
.kick{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--indigo)}
.h{font-size:clamp(30px,4vw,46px);margin:6px 0 10px}
.lead{font-size:20px;color:var(--ink2);max-width:62ch}
.headrow{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
.headrow>div{min-width:0}
h3{font-size:22px;margin-bottom:10px}
.small{font-size:16px;color:var(--muted)}
ul.clean{margin:0;padding:0;list-style:none;display:grid;gap:10px}
ul.clean li{display:flex;gap:12px;align-items:flex-start}
ul.clean li::before{content:"";flex:none;width:10px;height:10px;margin-top:10px;border-radius:50%;background:var(--c,var(--indigo))}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-lit{background:var(--indigo-soft);color:var(--indigo)}
.b-gdpr{background:var(--teal-soft);color:var(--teal)}
.b-hum{background:var(--coral-soft);color:var(--coral)}
.b-un{background:var(--gold-soft);color:var(--gold)}
.callout{border-radius:18px;padding:18px 22px;background:linear-gradient(120deg,var(--indigo-soft),#FFF4EC);font-size:21px;font-weight:700;border-left:6px solid var(--indigo)}
.btn{border:0;border-radius:14px;padding:12px 20px;white-space:nowrap;font-weight:700;background:var(--indigo);color:#fff;box-shadow:0 8px 18px rgba(75,63,209,.25)}
.btn.ghost{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo);box-shadow:none}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{min-height:1.5em;font-size:17px;margin-top:10px;color:var(--ink2)}

/* choice activity */
.qs{display:grid;gap:14px}
.q{background:#FBFAFF;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px}
.q .qt{font-weight:700;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:16px;font-weight:700;color:var(--ink2)}
.opt:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:16px;color:var(--ink2)}
.why b{color:var(--ink)}
.score{font-weight:700;color:var(--indigo)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--c,var(--indigo));border-color:var(--c,var(--indigo));color:#fff}

/* 3D gyroscope */
.gyro{position:relative;width:var(--s,230px);height:var(--s,230px);perspective:900px;flex:none}
.gyro .rig{position:absolute;inset:0;transform-style:preserve-3d;animation:tilt 12s ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--c,#4B3FD1);opacity:.55;transform-style:preserve-3d}
.ring::after{content:"";position:absolute;top:-9px;left:calc(50% - 9px);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--c,#4B3FD1) 70%)}
.ring.r1{animation:ra 8s linear infinite}
.ring.r2{animation:rb 11s linear infinite;opacity:.4}
.ring.r3{inset:12%;animation:rc 6.5s linear infinite;opacity:.45}
@keyframes ra{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes rb{from{transform:rotateY(68deg) rotateZ(0)}to{transform:rotateY(68deg) rotateZ(-360deg)}}
@keyframes rc{from{transform:rotateX(-45deg) rotateY(35deg) rotateZ(0)}to{transform:rotateX(-45deg) rotateY(35deg) rotateZ(360deg)}}
@keyframes tilt{0%,100%{transform:rotateX(8deg) rotateY(-10deg)}50%{transform:rotateX(-8deg) rotateY(10deg)}}
.core{position:absolute;inset:30%;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:calc(var(--s,230px) * .085);color:#fff;
  background:radial-gradient(circle at 32% 28%,#fff 0%,var(--c,#4B3FD1) 38%,color-mix(in srgb,var(--c,#4B3FD1) 70%,#000) 100%);
  box-shadow:0 18px 40px color-mix(in srgb,var(--c,#4B3FD1) 40%,transparent);animation:bob 4s ease-in-out infinite}
.gyro .ground{position:absolute;left:22%;right:22%;bottom:-18px;height:16px;border-radius:50%;background:radial-gradient(rgba(31,34,69,.22),transparent 70%);animation:sh 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.8);opacity:.6}}

/* Nova */
.nova{position:relative;display:grid;justify-items:center}
.nova img{width:100%;height:auto;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(46,38,120,.18))}
.nova .ground{position:static;width:60%;height:16px;margin-top:6px;border-radius:50%;background:radial-gradient(rgba(31,34,69,.22),transparent 70%);animation:sh 3.6s ease-in-out infinite}

/* cover + thanks */
.cover{position:relative;overflow:hidden;border-radius:34px;padding:clamp(26px,5vw,60px);background:linear-gradient(135deg,#FFFFFF 0%,#F4F1FF 50%,#FFF3EA 100%);box-shadow:0 26px 70px rgba(46,38,120,.16);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:26px;align-items:center}
.cover>*{position:relative;z-index:1;min-width:0}
.cover::before{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#DAD3FF 50%,#B2A6FA);opacity:.6}
.cover::after{content:"";position:absolute;width:260px;height:260px;left:-90px;bottom:-120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FFDCC8 50%,#F6AE8C);opacity:.55}
.pill{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--indigo);background:#fff;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(46,38,120,.08)}
.cover .prog2{font-size:20px;font-weight:700;color:var(--teal);margin-top:20px}
.cover h1{font-size:clamp(38px,5.8vw,72px);letter-spacing:-.01em;margin:8px 0 12px;background:linear-gradient(120deg,#1F2245 15%,#4B3FD1 60%,#C24A2C);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .sub{font-size:clamp(19px,2.2vw,24px);color:var(--ink2)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 26px}
.facts span{background:#fff;border-radius:14px;padding:9px 15px;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(46,38,120,.08)}
.facts b{color:var(--indigo)}
.big{font-size:20px;padding:15px 30px;border-radius:16px;background:linear-gradient(135deg,#5A4EE0,#3A2FB0)}
.host{display:flex;align-items:center;gap:12px;margin-top:24px;font-size:16px;color:var(--ink2)}
.host .dot{width:64px;height:64px;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 16px rgba(46,38,120,.18);flex:none;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--coral));display:grid;place-items:center;color:#fff;font-weight:700}
.art{display:grid;justify-items:center;gap:6px}
.art .nova{width:min(230px,100%)}
.wins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
.wins div{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(46,38,120,.08)}
.wins i{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-style:normal;color:#fff;background:var(--b)}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;opacity:0;animation:drop 3.4s ease-in forwards}
@keyframes drop{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(620px) rotate(560deg)}}

/* topic page */
.topic{min-height:58vh;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center;border-radius:34px;padding:clamp(28px,6vw,70px);background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.7));box-shadow:var(--shadow)}
.topic .num{font-size:clamp(70px,10vw,130px);font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:2px var(--c);opacity:.9}
.topic h2{font-size:clamp(40px,6vw,76px);margin:10px 0 12px;color:var(--ink)}
.topic .time{display:inline-block;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:7px 16px;font-size:16px}
.topic .sub{font-size:22px;color:var(--ink2);margin-top:14px}

/* specific activities */
.lens{border-radius:18px;padding:20px;background:#FBFAFF;border:1.5px solid var(--line)}
.lens p+p{margin-top:10px}
.para{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.para div{border-radius:16px;padding:14px;background:#fff;border-top:5px solid var(--c);box-shadow:0 6px 16px rgba(46,38,120,.07);font-size:15px}
.para b{display:block;font-size:17px;margin-bottom:4px}
.order{display:grid;gap:10px}
.slot{display:flex;gap:14px;align-items:flex-start;border-radius:16px;padding:12px 16px;background:#FBFAFF;border:1.5px dashed var(--line);min-height:56px}
.slot.filled{border-style:solid;border-color:#CFC8F6;background:#fff}
.slot .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--indigo-soft);color:var(--indigo)}
.slot.filled .n{background:var(--indigo);color:#fff}
.slot .d{font-size:16px;color:var(--ink2)}
.slot .ex{font-size:15px;color:var(--teal);margin-top:4px}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prompt{font-family:"Courier New",monospace;font-size:20px;background:#1F2245;color:#fff;border-radius:16px;padding:16px 20px}
.prompt .gen{color:#FFC9A8;font-weight:700}
.bars{display:grid;gap:10px;margin:16px 0}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-weight:700;font-size:17px}
.bar .track{height:22px;border-radius:999px;background:#EEEBFA;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7C70F0,#4B3FD1)}
.bar.wrong .fill{background:linear-gradient(90deg,#F2A487,#C24A2C)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px 12px;text-align:center;font-weight:700;font-size:16px;min-height:96px;display:grid;place-items:center;gap:4px;transition:transform .2s}
.tile span{font-size:28px}
.tile[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft);transform:translateY(-3px)}
.tile.r-ok{border-color:var(--ok);background:var(--ok-soft)}
.tile.r-no{border-color:var(--no);background:var(--no-soft)}
details{border:1.5px solid var(--line);border-radius:16px;background:#FBFAFF;padding:12px 16px}
details+details{margin-top:10px}
summary{font-weight:700;cursor:pointer}
details p{margin-top:8px;color:var(--ink2);font-size:17px}
.stat{text-align:left}
.stat .v{font-size:clamp(40px,5vw,58px);font-weight:700;color:var(--c)}
.stat p{font-size:17px;color:var(--ink2)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:15px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-v="use"][aria-pressed="true"]{background:var(--ok)}
.seg button[data-v="cond"][aria-pressed="true"]{background:var(--gold)}
.seg button[data-v="restrict"][aria-pressed="true"]{background:var(--no)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .view{grid-column:1/-1;font-size:16px;color:var(--ink2);background:#FBFAFF;border-radius:12px;padding:10px 14px}
.pace{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.pace div{border-radius:18px;padding:16px;background:#fff;box-shadow:0 6px 16px rgba(46,38,120,.07)}
.pace .L{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:var(--c);margin-bottom:10px;transform:perspective(300px) rotateY(-14deg);box-shadow:6px 8px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.pace b{display:block}
.pace p{font-size:16px;color:var(--ink2)}
.norm{text-align:center;font-size:clamp(20px,2.4vw,26px);font-weight:700;padding:20px;border-radius:18px;background:linear-gradient(120deg,var(--coral-soft),var(--indigo-soft))}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.out{white-space:pre-wrap;font-size:16px;color:var(--ink2);background:#FBFAFF;border-radius:14px;padding:14px;min-height:140px;border:1.5px solid var(--line)}
.aud{font-weight:700;margin-bottom:8px;color:var(--c)}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input.t,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:18px}
textarea{min-height:110px;resize:vertical}
blockquote{margin:0;font-size:clamp(20px,2.4vw,25px);font-weight:700;line-height:1.4;padding:20px 24px;border-radius:18px;background:#fff;border-left:6px solid var(--coral);box-shadow:var(--shadow)}
.pick{display:grid;gap:10px}
.pick button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-weight:700}
.pick button[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft);color:var(--indigo)}

/* footer nav + trainer */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nwrap{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center}
.count{font-weight:700;color:var(--muted);font-size:15px}
.nwrap .sp{flex:1}
.timer{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--gold);font-size:15px}
.timer button{border:1.5px solid var(--gold);background:#fff;color:var(--gold);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700}
#notes{margin-top:22px;border-radius:18px;padding:16px 20px;background:var(--gold-soft);border:1.5px dashed var(--gold);font-size:17px}
#notes b{color:var(--gold)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .grid2,.grid3,.cols3{grid-template-columns:1fr}
  .para{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pace{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cover,.topic{grid-template-columns:1fr}
  .art{order:-1}.art .nova{width:150px}
  .topic .gyro{--s:170px;justify-self:center;order:-1}
  .headrow{flex-direction:column}
  .badges{justify-content:flex-start}
  .wins{grid-template-columns:1fr}
  .task{grid-template-columns:1fr}
}
@media (max-width:480px){
  body{font-size:18px}
  .nwrap .btn{white-space:nowrap;padding:10px 14px}
  .count{font-size:13px}
  .cover .art .gyro{display:none}
  .art .nova{width:120px}
  .card{padding:18px}
  .bar{grid-template-columns:86px minmax(0,1fr) 46px;font-size:15px}
  .timer .lbl{display:none}
}

</style>

function copyText(text, note, selectEl){
  const ok = () => { note.textContent = 'Copied.'; };
  const fail = () => {
    if (selectEl){ const r = document.createRange(); r.selectNodeContents(selectEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    note.textContent = 'Copying is blocked here. The text is selected: press Ctrl+C (or Cmd+C).';
  };
  try { navigator.clipboard.writeText(text).then(ok, fail); } catch(e){ fail(); }
}

/* Reusable choice activity: items = [{q, a, why}] with shared options */
function choices(host, items, options, opts = {}){
  let first = 0, answered = 0;
  const draw = () => {
    first = 0; answered = 0;
    host.innerHTML = `<div class="qs">${items.map((it, i) => `
      <div class="q" data-i="${i}"><div class="qt">${opts.number === false ? '' : (i + 1) + '. '}${it.q}</div>
        <div class="opts" role="group" aria-label="Answer options">${(it.opts || options).map((o, j) => `<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div>
        <p class="why" hidden></p></div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><span class="score" aria-live="polite"></span><span class="sp"></span><button type="button" class="btn ghost rs">Reset</button></div>`;
    $$('.q', host).forEach(q => {
      const it = items[+q.dataset.i];
      $$('.opt', q).forEach(b => b.onclick = () => {
        const j = +b.dataset.j, right = j === it.a;
        $$('.opt', q).forEach(x => x.disabled = true);
        b.classList.add(right ? 'ok' : 'no');
        if (!right) $$('.opt', q)[it.a].classList.add('ok');
        const w = $('.why', q); w.hidden = false;
        w.innerHTML = `<b>${right ? (opts.yes || 'Yes.') : (opts.nope || 'Not quite.')}</b> ${it.why}`;
        answered++; if (right) first++;
        $('.score', host).textContent = answered === items.length ? `${first} of ${items.length} on the first try` : `${answered} of ${items.length} answered`;
      });
    });
    $('.rs', host).onclick = draw;
  };
  draw();
}

function pipeline(el){
  const S = [
    ['Data collection','Text, images, audio, user interactions or sensor data are gathered.','Thousands of essays, each with a teacher’s mark, are collected.'],
    ['Training','The model adjusts internal parameters to reduce error on a task.','The model tunes itself until its predicted marks match the teachers’ marks more closely.'],
    ['Pattern representation','The system learns statistical associations, not human-like understanding.','It learns which features go with high marks, such as length and vocabulary, without grasping the argument.'],
    ['Inference','Given a new input, the model generates a prediction or response.','A new essay arrives and the tool predicts a mark.'],
    ['Evaluation & feedback','Outputs are checked for accuracy, fairness, safety and usefulness.','Teachers compare predictions with their own marking and check fairness across student groups.']
  ];
  let placed = [];
  const draw = () => {
    const pool = S.map((s,i) => i).filter(i => !placed.includes(i)).sort((a,b) => ((a*7+3)%5) - ((b*7+3)%5));
    el.innerHTML = head('What is AI? · how it works','Build the machine learning pipeline','Tap the five stages in the right order. Each stage then shows a running example: an AI tool that predicts essay marks.') + `
    <div class="grid2">
      <div class="card"><h3>Stages to place</h3><div class="pool">${pool.map(i => `<button type="button" class="opt" data-i="${i}">${S[i][0]}</button>`).join('') || '<span class="small">All placed.</span>'}</div>
        <p class="fb" aria-live="polite">${placed.length === 5 ? 'Complete. Notice step 3: the model learns associations, not meaning. That is where both its power and its blind spots come from.' : 'Which stage comes next?'}</p>
        <button type="button" class="btn ghost" id="preset">Start again</button></div>
      <div class="card"><div class="order">${S.map((s,i) => placed[i] != null ? `<div class="slot filled"><span class="n">${i+1}</span><div><b>${s[0]}</b><div class="d">${s[1]}</div><div class="ex">Example: ${s[2]}</div></div></div>` : `<div class="slot"><span class="n">${i+1}</span><span class="small">…</span></div>`).join('')}</div></div>
    </div>`;
    $$('.pool .opt', el).forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (i === placed.length){ placed.push(i); draw(); const nb = $('.pool .opt', el); if (nb) nb.focus(); }
      else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); $('.fb', el).textContent = `Not yet. Think about what has to happen before “${S[i][0]}”.`; }
    });
    $('#preset', el).onclick = () => { placed = []; draw(); };
  };
  draw();
}

      'If past hires leaned towards one profile, the model learns to prefer that profile and calls it “quality”.',
      'The employer. Under the EU AI Act, AI used in recruitment is high-risk and needs human oversight of decisions.']},
    {k:'Video feed recommending content to teenagers', b:['lit'], a:[
      'Viewing histories and watch-time signals from millions of users.',
      'Mainly the platform, through attention and advertising. Sometimes learners who find useful content.',
      'Creators in minority languages and slower, educational content that gets fewer clicks.',
      'Optimising for engagement can amplify sensational or extreme content.',
      'The platform and its design choices. Schools and parents often have little visibility into how it works.']},
    {k:'Face recognition attendance at the school gate', b:['gdpr','hum'], a:[
      'Face images, often from datasets with uneven representation of skin tones, ages and genders.',
      'Administration saves time on registers.',
      'Students who opt out, and those the system misrecognises more often.',
      'Some systems show higher error rates for certain groups, so errors are not evenly shared.',
      'The school as data controller. Under GDPR, biometric data used to identify people is special-category data with strict conditions.']}
  ];
  let k = 0;
  const draw = () => {
    el.innerHTML = head('Everyday life · critical lens','Five questions for any AI system','Do not stop at “Does it work?”. Pick a case, discuss each question first, then open a perspective to compare.', badges(...C[k].b)) + `
    <div class="card"><div class="tabs" role="tablist" aria-label="Cases">${C.map((c,i) => `<button class="tab" role="tab" type="button" aria-selected="${i===k}" data-i="${i}">${c.k}</button>`).join('')}</div>
      ${Q.map((q,i) => `<details><summary>${i+1}. ${q}</summary><p>${C[k].a[i]}</p></details>`).join('')}</div>`;
    $$('.tab', el).forEach(t => t.onclick = () => { k = +t.dataset.i; draw(); $$('.tab', el)[k].focus(); });
  };
  draw();
}

function oppRisk(el){
  el.innerHTML = head('AI in education · 22–33 min','Opportunity or risk?','AI is changing learning design, assessment, administration and learner support. Sort each statement, then notice which ones could be both.', badges('lit','gdpr','hum')) + `<div class="card"><div id="oq"></div></div>`;
  const O = 0, R = 1;
  choices($('#oq', el), [
    {q:'Adjusting pace and difficulty to each learner.', a:O, why:'Personalised learning. It needs learner data, so it also carries a privacy question.'},
    {q:'Students outsourcing reasoning instead of working through a hard problem.', a:R, why:'Epistemic dependence: it removes the productive struggle where learning happens.'},
    {q:'Live captions and translation for a multilingual class.', a:O, why:'Accessibility that directly supports diverse learners.'},
    {q:'Training data that barely includes some languages and perspectives.', a:R, why:'Bias and misrepresentation. Outputs will serve some learners worse than others.'},
    {q:'Drafting rubrics and differentiated tasks in minutes.', a:O, why:'Teacher augmentation, as long as the teacher reviews and owns the result.'},
    {q:'Processing learner data without clear consent.', a:R, why:'Privacy and consent. In the EU, GDPR applies to student data.'},
    {q:'Fast formative feedback on student drafts.', a:O, why:'Helpful when it is designed pedagogically, with the student still doing the revision.'},
    {q:'Unclear authorship of submitted essays.', a:R, why:'Assessment validity: generative AI challenges traditional ideas of original work.'}
  ], ['Opportunity','Risk']);
}

function useRestrict(el){
  const T = [
    ['Generating reading passages at three difficulty levels on one topic.','use','Use. Low stakes, saves time, and the teacher reviews the level and accuracy. Supports equity through differentiation.'],
    ['Drafting end-of-year report comments from the teacher’s own notes.','cond','Use with conditions. No names or sensitive data in the tool, and the teacher rewrites in their own voice. The judgement stays human.'],
    ['Automatically grading final exams that decide who moves up a year.','restrict','Restrict. High-stakes decisions need human judgement and clear accountability. Errors here harm real futures.'],
    ['Students using AI to generate counterarguments before a debate.','cond','Use with conditions. Students disclose use and must argue in their own words. AI supports the thinking, it does not replace it.'],
    ['Pasting named student essays into a free chatbot for feedback.','restrict','Restrict. Personal data leaves your control without consent. In the EU this is a GDPR problem.'],
    ['Live captions and translation for newly arrived students.','use','Use. Strong accessibility and equity benefit. Spot-check translations of key instructions.']
  ];
  const lab = {use:'Use', cond:'Use with conditions', restrict:'Restrict'};
  const saved = store.get('ur', {});
  el.innerHTML = head('AI in education · decide','Use, use with conditions, or restrict?','There is no single right answer. Decide first, then compare with a considered view based on human agency, equity and the quality of knowledge.', badges('hum','gdpr')) + `
  <div class="card">${T.map((t,i) => `<div class="task" data-i="${i}"><b>${t[0]}</b>
    <div class="seg" role="group" aria-label="Your decision">${Object.keys(lab).map(v => `<button type="button" data-v="${v}" aria-pressed="${saved[i]===v}">${lab[v]}</button>`).join('')}</div>
    <p class="view" ${saved[i] ? '' : 'hidden'}>${saved[i] ? viewText(i) : ''}</p></div>`).join('')}</div>`;
  function viewText(i){ const s = saved[i], t = T[i]; return `<b>${s === t[1] ? 'Same as the considered view.' : 'Different from the considered view: discuss why.'}</b> ${t[2]}`; }
  $$('.task', el).forEach(r => { const i = +r.dataset.i; $$('.seg button', r).forEach(b => b.onclick = () => {
    saved[i] = b.dataset.v; store.set('ur', saved);
    $$('.seg button', r).forEach(x => x.setAttribute('aria-pressed', x===b));
    const v = $('.view', r); v.hidden = false; v.innerHTML = viewText(i);
  }); });
}

function strengths(el){
  el.innerHTML = head('ChatGPT & generative AI · 33–42 min','Strong at it, or be careful?','ChatGPT is a generative conversational system built on a large language model. Its value depends on your prompt, your prior knowledge and how you verify the output.', badges('lit')) + `<div class="card"><div id="sq"></div></div>`;
  choices($('#sq', el), [
    {q:'Explaining one concept at three levels of complexity.', a:0, why:'A core strength. Still read it for accuracy.'},
    {q:'Telling you whether a policy changed last month.', a:1, why:'It may not know what is current. Check an official source.'},
    {q:'Generating examples, analogies and practice questions.', a:0, why:'Fast and useful raw material for teaching.'},
    {q:'Giving exact sources with page numbers.', a:1, why:'It can produce citations that look real but are invented.'},
    {q:'Brainstorming and outlining a lesson or paper.', a:0, why:'A good thinking partner for first drafts.'},
    {q:'Judging whether content is ethically right for your learners.', a:1, why:'It does not know your context, values or students. That judgement is yours.'},
    {q:'Telling you when its own answer is wrong.', a:1, why:'It can be confidently wrong. Ask it for its uncertainty, then verify.'}

}

function pace(el){
  const P = [['P','Purpose','Define the learning goal before you prompt.','#4B3FD1'],['A','Ask critically','Request sources, assumptions, counterarguments and uncertainty.','#0E7570'],['C','Check','Verify factual claims against credible primary or scholarly sources.','#C24A2C'],['E','Evaluate ethics','Consider privacy, attribution, academic policy, bias and equity.','#9A6512']];
  el.innerHTML = head('ChatGPT · responsible use','The PACE protocol','Four habits for using generative AI responsibly. Then diagnose: which step was skipped?', badges('hum','gdpr')) + `
  <div class="pace">${P.map(p => `<div style="--c:${p[3]}"><span class="L" aria-hidden="true">${p[0]}</span><b>${p[1]}</b><p>${p[2]}</p></div>`).join('')}</div>
  <div class="card"><h3>Which PACE step was missed?</h3><div id="pq"></div></div>
  <p class="norm" style="margin-top:20px">AI may support thinking, but it must not substitute for thinking.</p>`;
  choices($('#pq', el), [
    {q:'A teacher types “make something about fractions” and gets a long, unfocused handout.', a:0, why:'No clear learning goal, so no clear output. Start with Purpose.'},
    {q:'A student copies dates from an AI summary of a historical event straight into an assignment.', a:2, why:'The facts were never checked against a reliable source.'},
    {q:'A teacher pastes a student’s full name, grades and support needs into a public chatbot.', a:3, why:'Privacy and consent were ignored. This is an ethics and GDPR issue.'},
    {q:'A researcher asks for “the answer” and never asks what the model is unsure about.', a:1, why:'Asking critically means asking for assumptions, counterarguments and uncertainty.'}
  ], P.map(p => p[0] + ' · ' + p[1]));
}

function audienceLab(el){
  const A = [['a 15-year-old student','A 15-year-old','#4B3FD1'],['a university student','A university student','#0E7570'],['an education policymaker','An education policymaker','#C24A2C']];
  const EX = [
    'Machine learning is when a computer gets better at a task by looking at lots of examples instead of being told every rule. Show it thousands of photos labelled “cat” or “dog” and it slowly figures out the patterns itself. Your music app does this when it learns what songs you like.',
    'Machine learning is a family of methods in which a model’s parameters are fitted to data so that it generalises to new cases. In supervised learning, a model minimises a loss function over labelled examples. Performance is judged on held-out data, and issues like overfitting, data bias and interpretability shape how far results can be trusted.',
    'Machine learning systems learn patterns from historical data to make predictions, for example flagging students at risk of dropping out. They can save time and target support, but they inherit the biases of their data, raise privacy questions, and need clear accountability, transparency and human review before they influence decisions about learners.'
  ];
  el.innerHTML = head('ChatGPT · guided activity · 8 min','One concept, three audiences','Ask an AI tool to explain the same concept to three different audiences. Then compare: what changed, and why?') + `
  <div class="card"><label class="f" for="concept">Concept</label><input class="t" id="concept" value="${esc(store.get('concept','machine learning'))}">
    <p class="small" style="margin-top:8px">Prompt for each audience: <span id="ptxt"></span></p>
    <div class="row" style="margin-top:12px"><button type="button" class="btn" id="run" hidden>Try it with AI</button><button type="button" class="btn ghost" id="stop" hidden>Stop</button><button type="button" class="btn ghost" id="cp">Copy the prompts</button></div>
    <p class="fb" id="lnote" aria-live="polite">Paste the prompts into your own AI tool, or compare the sample answers below.</p></div>
  <div class="cols3" style="margin-top:20px">${A.map((a,i) => `<div class="card" style="--c:${a[2]}"><div class="aud">${a[1]}</div><div class="out" id="o${i}">${EX[i]}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:20px"><h3>Discuss</h3><ul class="clean">
    <li>What changed across audiences, and why?</li><li>Which explanation was clearest, and what made it clear?</li><li>What knowledge did the AI seem to assume?</li><li>Which claims would need verification?</li><li>How could a teacher use this activity without replacing student reasoning?</li></ul></div>`;
  const pr = a => `Explain "${$('#concept', el).value.trim() || 'machine learning'}" to ${a}.`;
  const upd = () => { $('#ptxt', el).textContent = pr('[audience]'); store.set('concept', $('#concept', el).value); };
  $('#concept', el).oninput = upd; upd();
  $('#cp', el).onclick = () => copyText(A.map(a => pr(a[0])).join('\n'), $('#lnote', el), $('#ptxt', el));
  samplePromise.then(sample => {
    if (!sample || !document.body.contains(el)) return;
    const run = $('#run', el), stop = $('#stop', el), note = $('#lnote', el); run.hidden = false; let ctl = null;
    run.onclick = async () => {
      ctl = new AbortController(); run.disabled = true; stop.hidden = false;
      A.forEach((a,i) => $('#o'+i, el).textContent = '…');
      try {
        for (let i = 0; i < A.length; i++){
          const out = $('#o'+i, el); out.textContent = 'Thinking…';
          await sample(pr(A[i][0]) + ' Use at most 110 words of plain text, no markdown, no headings.', { modelTier:'quick', cache:false, signal: ctl.signal, onText: ({text}) => { out.textContent = text; } });
        }
        note.textContent = 'Done. Now compare the three explanations using the questions below.';
      } catch (e) {
        const msg = { not_granted:'AI was not allowed for this page. Use your own AI tool instead.', sampling_disabled:'AI is not available on this account. Use your own AI tool instead.', rate_limited:'Too many requests just now. Wait a minute, then try again.', session_expired:'Please sign in to Claude again, then try once more.', refused:'The AI declined this request. Try a different concept.' }[e && e.code];
        note.textContent = e && e.code === 'cancelled' ? 'Stopped.' : (msg || 'Something went wrong. Try again, or use your own AI tool.');
        if (e && ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) run.hidden = true;
      } finally { run.disabled = false; stop.hidden = true; }
    };
    stop.onclick = () => ctl && ctl.abort();
  });
}

function reflection(el){
  const r = store.get('refl', {p:'', u:'', x:'', j:''});
  el.innerHTML = head('Reflection · 42–45 min','Critical questions and your transfer task','', badges('hum','un')) + `
  <blockquote>“AI is not merely a tool added to education; it is a socio-technical system that reshapes what counts as knowledge, authorship, teaching, and learning.”</blockquote>
  <div class="grid2" style="margin-top:20px">

      <label class="f" for="rx">One task where it should be restricted</label><input class="t" id="rx" value="${esc(r.x)}">
      <label class="f" for="rj">Justify both, using human agency, equity and quality of knowledge</label><textarea id="rj">${esc(r.j)}</textarea>
      <div class="row" style="margin-top:12px"><button type="button" class="btn" id="rcopy">Copy my answers</button></div><p class="fb" id="rnote" aria-live="polite"></p></div>
  </div>
  <div class="callout" style="margin-top:20px">Key takeaway: move beyond tool use to critical socio-technical judgement. Understand how systems learn, recognise their embedded values, question their consequences, and keep human agency in educational decisions.</div>
  <pre class="sr" id="rall"></pre>`;
  const ids = {p:'rp', u:'ru', x:'rx', j:'rj'};
  const all = () => `Reflection: ${r.p}\n\nUse AI for: ${r.u}\nRestrict AI for: ${r.x}\nWhy: ${r.j}`;

  $('#rcopy', el).onclick = () => { const pre = $('#rall', el); pre.textContent = all(); pre.classList.remove('sr'); pre.style.whiteSpace = 'pre-wrap'; pre.style.marginTop = '12px'; pre.style.fontFamily = 'inherit'; copyText(all(), $('#rnote', el), pre); };
}

/* ================= STRUCTURE ================= */
const SECTIONS = [
  {id:'o', label:'Orientation', range:'0–5 min', mins:5, screens:[
    {render:courseWelcome, notes:''},
    {render:cover, notes:''},
    {render:orientation, notes:''}]},
  {id:'t1', label:'1 · What is AI?', range:'5–15 min', mins:10, screens:[
    {render:topicPage({n:'01',title:'What is AI?',time:'5–15 min',sub:'Definitions, paradigms and mechanisms',core:'AI',c:'#4B3FD1'}), notes:''},
    {render:lenses, notes:''},
    {render:paradigms, notes:''},
    {render:pipeline, notes:''},
    {render:tokens, notes:''}]},
  {id:'t2', label:'2 · Everyday AI', range:'15–22 min', mins:7, screens:[
    {render:topicPage({n:'02',title:'AI in everyday life',time:'15–22 min',sub:'Invisible AI and algorithmic mediation',core:'Daily',c:'#0E7570'}), notes:''},
    {render:invisible, notes:''},
    {render:critical, notes:''}]},
  {id:'t3', label:'3 · AI in education', range:'22–33 min', mins:11, screens:[
    {render:topicPage({n:'03',title:'AI in education',time:'22–33 min',sub:'Personalisation, assessment, equity and integrity',core:'Learn',c:'#C24A2C'}), notes:''},
    {render:oppRisk, notes:''},
    {render:evidence, notes:''},
    {render:useRestrict, notes:''}]},
  {id:'t4', label:'4 · ChatGPT & GenAI', range:'33–42 min', mins:9, screens:[
    {render:topicPage({n:'04',title:'ChatGPT & generative AI',time:'33–42 min',sub:'Capabilities, limitations, responsible use',core:'Chat',c:'#9A6512'}), notes:''},
    {render:strengths, notes:''},
    {render:pace, notes:''},
    {render:audienceLab, notes:''}]},
  {id:'r', label:'Reflection', range:'42–45 min', mins:3, screens:[
    {render:topicPage({n:'05',title:'Reflection',time:'42–45 min',sub:'Critical questions and a transfer task',core:'Think',c:'#4B3FD1'}), notes:''},
    {render:reflection, notes:''},
    {render:thanks, notes:''}]}
];

/* ================= ENGINE ================= */
const FLAT = []; SECTIONS.forEach((s, si) => s.screens.forEach(sc => FLAT.push({si, sc})));
let pos = Math.min(Math.max(+store.get('pos', 0) || 0, 0), FLAT.length - 1);
const START = FLAT.findIndex(f => f.si === 1), TOTAL = FLAT.length - START;
const chips = $('#chips');
chips.innerHTML = SECTIONS.map((s, i) => `<button type="button" class="chip" data-i="${i}">${s.label}</button>`).join('');
$$('.chip', chips).forEach(c => c.onclick = () => go(FLAT.findIndex(f => f.si === +c.dataset.i)));

let tSec = -1, tLeft = 0, tRun = null;
const fmt = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function setTimerFor(si){ if (si === tSec) return; tSec = si; clearInterval(tRun); tRun = null; tLeft = SECTIONS[si].mins * 60; $('#tleft').textContent = fmt(tLeft); $('#tgo').textContent = 'Start'; }
$('#tgo').onclick = () => {
  if (tRun){ clearInterval(tRun); tRun = null; $('#tgo').textContent = 'Start'; return; }
  $('#tgo').textContent = 'Pause';
  tRun = setInterval(() => { tLeft = Math.max(0, tLeft - 1); $('#tleft').textContent = fmt(tLeft); if (!tLeft){ clearInterval(tRun); tRun = null; $('#tgo').textContent = 'Start'; } }, 1000);
};
$('#treset').onclick = () => { const s = tSec; tSec = -1; setTimerFor(s); };

const tbtn = $('#tbtn');
function setTrainer(on){ store.set('trainer', on); tbtn.setAttribute('aria-pressed', on); tbtn.textContent = 'Trainer notes: ' + (on ? 'on' : 'off'); $('#notes').classList.toggle('hide', !on); $('#timer').classList.toggle('hide', !on); }
tbtn.onclick = () => setTrainer(tbtn.getAttribute('aria-pressed') !== 'true');

function go(i){
  pos = Math.min(Math.max(i, 0), FLAT.length - 1); store.set('pos', pos);
  const f = FLAT[pos], s = SECTIONS[f.si];
  const stage = $('#stage'); stage.style.animation = 'none'; void stage.offsetWidth; stage.style.animation = '';
  f.sc.render(stage);
  $('#seclabel').textContent = `${s.label.replace(/^\d · /,'')} · ${s.range}`;
  const inOrient = pos < START;
  $('#poslabel').textContent = inOrient ? '' : `${pos - START + 1} / ${TOTAL}`;
  $('#count').textContent = inOrient ? '' : `Screen ${pos - START + 1} of ${TOTAL}`;
  ['#prev','#next','#count'].forEach(id => $(id).classList.toggle('hide', inOrient));
  $('.nav').classList.toggle('hide', inOrient && MODE !== 'trainer');
  $$('.chip', chips).forEach((c, ci) => { c.classList.toggle('done', ci < f.si); if (ci === f.si) c.setAttribute('aria-current','step'); else c.removeAttribute('aria-current'); });
  const cur = $$('.chip', chips)[f.si]; if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest', inline:'nearest'});
  $('#prev').disabled = pos === 0;
  const isLast = pos === FLAT.length - 1;
  $('#next').disabled = false;
  $('#next').textContent = isLast ? 'Finish 🎉' : 'Next →';
  if (MODE === 'trainer'){ $('#ntext').textContent = f.sc.notes || ''; setTimerFor(f.si); }
  window.scrollTo({top:0});
}
$('#prev').onclick = () => go(pos - 1);
$('#next').onclick = () => pos === FLAT.length - 1 ? openParty() : go(pos + 1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') go(pos + 1);
  if (e.key === 'ArrowLeft') go(pos - 1);
});

if (MODE === 'trainer') setTrainer(store.get('trainer', true));
else { tbtn.remove(); $('#notes').remove(); $('#timer').remove(); }
go(pos);
</script>
