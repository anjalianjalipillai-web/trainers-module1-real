<title>AI for Smart Explorers · Module 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky class bar (brand, topic stepper, timer) over one centred "stage" that shows one screen at a time; trainer notes slide in below the stage. Deliberately light-only, per the Young IT Germany standard. */
:root{
  --bg:#FFFFFF; --bg1:#E9F1FF; --bg2:#E7F8F1; --panel:#FFFFFF; --line:#DCE3EF; --ink:#1B2A4A; --ink-2:#46526B; --muted:#6A748A;
  --blue:#2D6CDF; --blue-soft:#EAF1FD; --teal:#0B7A73; --teal-soft:#E3F4F2; --purple:#7B4FD8; --purple-soft:#F0EBFC;
  --orange:#B4500A; --orange-soft:#FCEFE4; --red:#C23A4F; --red-soft:#FBE9EC; --green:#23864A; --green-soft:#E6F4EB; --gold:#F2B21B; --gold-soft:#FEF6DD;
  --font:Arial, Helvetica, sans-serif;
  --r:16px; --shadow:0 8px 24px rgba(27,42,74,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg1) 35%,var(--bg2) 100%) fixed;color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg1)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* class bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{font-weight:700;font-size:15px;color:var(--teal);letter-spacing:.02em}
.brand span{display:block;color:var(--muted);font-weight:400;font-size:14px;letter-spacing:0}
.brand{flex:1;min-width:0}
.steps{display:flex;flex-wrap:nowrap;gap:6px;order:3;flex:1 1 100%;min-width:0;overflow-x:auto;padding-bottom:2px}
.step{flex:none;white-space:nowrap;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--ink-2)}
.step[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.step.done{border-color:var(--green);color:var(--green)}
.timer{display:flex;align-items:center;gap:6px;background:var(--bg1);border-radius:999px;padding:4px 6px 4px 14px}
.timer b{font-variant-numeric:tabular-nums;font-size:18px;min-width:56px}
.timer.over b{color:var(--red)}
.iconbtn{border:0;background:#FFFFFF;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.toggle{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}

/* stage */
main{padding-block:28px 48px;position:relative;z-index:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;color:var(--muted);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stage{min-height:420px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;background:var(--ink);color:#FFFFFF}
.btn.ghost{background:#FFFFFF;color:var(--ink);box-shadow:0 2px 8px rgba(27,42,74,.08)}
.btn.small{padding:8px 16px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.accent{background:var(--c,var(--blue))}

/* topic title page */
.topic{border-radius:28px;padding:56px clamp(24px,5vw,64px);color:#FFFFFF;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#1B2A4A));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:center;box-shadow:0 18px 40px rgba(27,42,74,.18);overflow:hidden}
.topic .txt{display:grid;gap:18px;min-width:0}
@media (max-width:760px){.topic{grid-template-columns:1fr}.cube-wrap{justify-self:center}}
.topic .num{font-size:22px;font-weight:700;opacity:.85}
.topic h1{font-size:clamp(34px,5.5vw,60px)}
.topic .mins{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 16px;font-weight:700;font-size:17px;justify-self:start}
.topic ul{margin:6px 0 0;padding-left:22px;font-size:20px;display:grid;gap:4px}

/* shared screen parts */
.h{font-size:clamp(28px,4vw,40px);margin-bottom:8px}
.lead{font-size:20px;color:var(--ink-2);max-width:62ch;margin-bottom:22px}
.badge{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 12px;background:var(--blue);color:#FFFFFF;vertical-align:middle;margin-left:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.card{background:var(--panel);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:22px;margin-bottom:8px}
.tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--blue))}
.callout{border-radius:var(--r);padding:18px 22px;background:var(--gold-soft);border:1.5px solid var(--gold);margin-top:20px}
.fb{margin-top:12px;font-weight:700}
.fb.good{color:var(--green)} .fb.bad{color:var(--red)}
.mono{font-family:"Courier New",Courier,monospace;font-size:17px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}

/* poll */
.poll{display:grid;gap:12px;max-width:760px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg1);border-radius:14px;padding:12px 14px}
.prow .lab{font-weight:700}
.pbar{grid-column:1/-1;height:12px;background:#FFFFFF;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
.cnt{display:flex;align-items:center;gap:6px}
.cnt b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;font-size:22px}
.cnt button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:20px}

/* steps explainer */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0 6px}
.fstep{border:2px solid var(--line);border-radius:var(--r);padding:20px;background:var(--bg);transition:all .25s;opacity:.5}
.fstep.on{opacity:1;border-color:var(--blue);background:var(--blue-soft);box-shadow:var(--shadow)}
.fstep .n{font-size:34px;font-weight:700;color:var(--blue)}
.fstep h3{font-size:22px;margin:4px 0 6px}
@media (max-width:640px){.flow{grid-template-columns:1fr}}

/* next word game */
.sent{font-size:clamp(26px,3.6vw,36px);font-weight:700;margin:8px 0 18px}
.sent u{color:var(--blue);text-decoration-thickness:3px}
.guess{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.guess input{flex:1;min-width:0;max-width:360px;border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.probs{display:grid;gap:10px;max-width:720px}
.prob{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:12px;align-items:center}
.prob .w{font-weight:700;overflow-wrap:anywhere}
.prob .track{height:26px;background:var(--panel);border-radius:8px;overflow:hidden}
.prob .track i{display:block;height:100%;background:var(--blue);width:0;transition:width .7s ease}
.prob .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.prob.top .track i{background:var(--teal)}
.note{font-size:15px;color:var(--muted);margin-top:10px}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lbl{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px}
.lbl.u{background:var(--red-soft);color:var(--red)} .lbl.n{background:var(--green-soft);color:var(--green)}

/* choice cards */
.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.choice{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 16px;font-weight:700}
.choice.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.choice.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.qcard{background:var(--panel);box-shadow:var(--shadow);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.qcard .q{font-weight:700;font-size:19px}
.qcard .why{font-size:16px;color:var(--ink-2)}
.score{display:inline-flex;gap:10px;align-items:center;font-weight:700;background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:8px 18px;margin-bottom:18px}
.score b{font-variant-numeric:tabular-nums}

/* sorter */
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:14px;border:2px dashed var(--line);border-radius:var(--r);margin-bottom:16px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:17px;text-align:left}
.chip.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold)}
.chip.ok{border-color:var(--green)} .chip.diff{border-color:var(--orange)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{border-radius:var(--r);padding:14px;min-height:180px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;text-align:left;background:var(--panel)}
.col h3{font-size:18px}
.col.c1{background:var(--blue-soft)} .col.c2{background:var(--gold-soft)} .col.c3{background:var(--green-soft)}
.col .hint{font-size:14px;color:var(--ink-2)}
@media (max-width:760px){.cols{grid-template-columns:1fr}}

/* tools */
.tool h3{display:flex;justify-content:space-between;gap:8px}
.tool .by{font-size:14px;color:var(--muted);font-weight:400}
.lists{margin-top:18px}
.lists ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}

/* prompt lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.fields{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.field select,.field input,.field textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%}
.field textarea{min-height:110px;resize:vertical}
.part-role{color:var(--blue)} .part-task{color:var(--teal)} .part-det{color:var(--purple)} .part-fmt{color:var(--orange)}
.out{min-height:120px;max-height:460px;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .m{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--red-soft);color:var(--red)}
.checks .ok .m{background:var(--green-soft);color:var(--green)}

/* trainer notes */
.notes{margin-top:26px;border-radius:var(--r);border:2px solid var(--gold);background:var(--gold-soft);padding:18px 22px}
.notes h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.notes p{font-size:17px}

.takeaways{display:grid;gap:12px;counter-reset:t;margin-top:8px}
.takeaways div{background:var(--panel);box-shadow:var(--shadow);border-radius:14px;padding:14px 18px 14px 58px;position:relative;font-weight:700}
.takeaways div::before{counter-increment:t;content:counter(t);position:absolute;left:16px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#FFFFFF;display:grid;place-items:center;font-size:16px}

/* 3D decor */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFFFFF 0%,var(--o) 38%,color-mix(in srgb,var(--o) 65%,#1B2A4A) 100%);box-shadow:0 30px 60px rgba(27,42,74,.12);opacity:.55;animation:float 14s ease-in-out infinite}
.orbs i:nth-child(1){--o:#9CC2FF;width:150px;height:150px;left:-40px;top:22%;animation-duration:16s}
.orbs i:nth-child(2){--o:#9FE3C8;width:90px;height:90px;right:6%;top:58%;animation-duration:12s;animation-delay:-4s}
.orbs i:nth-child(3){--o:#C9B6F5;width:60px;height:60px;left:12%;bottom:8%;animation-duration:11s;animation-delay:-2s}
.orbs i:nth-child(4){--o:#FFD98A;width:46px;height:46px;right:20%;top:18%;animation-duration:13s;animation-delay:-6s}
.orbs i:nth-child(5){--o:#9CC2FF;width:110px;height:110px;right:-30px;bottom:-20px;animation-duration:18s;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-26px,0)}}
.cube-wrap{width:170px;height:170px;perspective:700px;justify-self:end}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 14s linear infinite}
.cube span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:26px;letter-spacing:.04em;color:#1B2A4A;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.6));border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 0 30px rgba(27,42,74,.12)}
.cube .f1{transform:translateZ(85px)} .cube .f2{transform:rotateY(90deg) translateZ(85px)} .cube .f3{transform:rotateY(180deg) translateZ(85px)}
.cube .f4{transform:rotateY(-90deg) translateZ(85px)} .cube .f5{transform:rotateX(90deg) translateZ(85px)} .cube .f6{transform:rotateX(-90deg) translateZ(85px)}
@keyframes spin{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.nova{width:190px;max-width:100%;justify-self:center;display:grid;justify-items:center}
.nova img{width:100%;height:auto;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 18px 22px rgba(45,108,223,.25))}
.nova .shadow{width:60%;height:14px;border-radius:50%;background:rgba(27,42,74,.16);filter:blur(4px);margin-top:6px;animation:shade 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes shade{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.8);opacity:.6}}
@media (max-width:640px){.hero{grid-template-columns:1fr}.nova{width:140px}}
.pick{cursor:pointer;border:2px solid transparent}
.pick.on{border-color:var(--blue);background:#FFFFFF}

/* welcome + thank-you pages */
.cover{position:relative;border-radius:32px;overflow:hidden;padding:clamp(28px,5vw,64px);background:linear-gradient(135deg,#FFFFFF 0%,#EEF4FF 45%,#E6F8EF 100%);box-shadow:0 24px 60px rgba(27,42,74,.14);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:24px;align-items:center}
.cover::before,.cover::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.6}
.cover::before{width:340px;height:340px;right:-90px;top:-110px;background:radial-gradient(circle at 35% 30%,#FFFFFF,#BBD3FF 45%,#7FA8F0)}
.cover::after{width:220px;height:220px;left:-70px;bottom:-90px;background:radial-gradient(circle at 35% 30%,#FFFFFF,#B9EBD5 45%,#6CC9A1)}
.cover>*{position:relative;z-index:1;min-width:0}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:#FFFFFF;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(27,42,74,.08);justify-self:start}
.cover h1{font-size:clamp(40px,6.4vw,78px);line-height:1.02;letter-spacing:-.01em;margin:18px 0 10px;background:linear-gradient(120deg,#1B2A4A 10%,#2D6CDF 60%,#0B7A73);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .sub{font-size:clamp(20px,2.4vw,26px);font-weight:700;color:var(--ink)}
.cover .tagline{font-size:20px;color:var(--ink-2);margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 26px}
.facts span{background:#FFFFFF;border-radius:14px;padding:10px 16px;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(27,42,74,.08)}
.facts b{color:var(--blue)}
.host{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:16px;color:var(--ink-2)}
.host .dot{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#FFFFFF;font-weight:700}
.stage3d{display:grid;justify-items:center;gap:10px}
.stage3d .nova{width:230px}
.btn.big{font-size:20px;padding:16px 30px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#1F55B8);box-shadow:0 12px 24px rgba(45,108,223,.3)}
@media (max-width:760px){.cover{grid-template-columns:1fr}.stage3d{order:-1}.stage3d .nova{width:150px}}
.thanks{background:linear-gradient(135deg,#FFFFFF 0%,#F0FAF5 50%,#EEF4FF 100%)}
.thanks h1{background:linear-gradient(120deg,#23864A,#0B7A73 50%,#2D6CDF);-webkit-background-clip:text;background-clip:text;color:transparent}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0 24px}
.badges div{display:flex;gap:12px;align-items:center;background:#FFFFFF;border-radius:16px;padding:14px 16px;font-weight:700;box-shadow:0 6px 16px rgba(27,42,74,.08)}
.badges i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal;color:#FFFFFF;font-size:18px;background:var(--b)}
@media (max-width:520px){.badges{grid-template-columns:1fr}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;opacity:0;animation:drop 3.4s ease-in forwards}
@keyframes drop{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(560px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<header class="bar">
  <div class="wrap">
    <div class="brand">Young IT Germany<span>AI for Smart Explorers · Level 1 · Module 1</span></div>
    <nav class="steps" id="steps" aria-label="Class topics"></nav>
    <div class="timer" id="timer" aria-live="off"><b id="tval">4:00</b><button class="iconbtn" id="tgo" type="button">Start</button><button class="iconbtn" id="treset" type="button">Reset</button></div>
    <button class="toggle" id="trainer" type="button" aria-pressed="false">Trainer notes</button>
  </div>
</header>

<main class="wrap">
  <div class="meta"><span id="where"></span><span id="count"></span></div>
  <section class="stage" id="stage" aria-live="polite"></section>
  <div class="nav">
    <button class="btn ghost" id="prev" type="button">← Back</button>
    <button class="btn" id="next" type="button">Next →</button>
  </div>
  <aside class="notes" id="notes" hidden><h3>Trainer notes</h3><p id="ntext"></p></aside>
</main>

<script>
(function(){
const MODE = 'explorer';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('m1:'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('m1:'+k, JSON.stringify(v)); }catch(e){} }
};
let samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null);

/* ---------------- content ---------------- */
const SECTIONS = [
 {id:'welcome', label:'Welcome', mins:4, c:'var(--blue)', screens:[
   {notes:'', render:cover},

/* ---------------- navigation ---------------- */
const flat = [];
SECTIONS.forEach((s,si) => s.screens.forEach((sc,ci) => flat.push({s, si, sc, ci})));
let pos = Math.min(store.get('pos', 0), flat.length-1);
const visited = new Set(store.get('visited', [0]));

function renderSteps(){
  const cur = flat[pos].si;
  $('#steps').innerHTML = SECTIONS.map((s,i) => {
    const first = flat.findIndex(f => f.si === i);
    const done = i < cur;
    return `<button type="button" class="step${done?' done':''}" data-go="${first}" aria-current="${i===cur}">${done?'✓ ':''}${esc(s.label)}</button>`;
  }).join('');
}
function go(p){
  pos = Math.max(0, Math.min(flat.length-1, p)); visited.add(pos);
  store.set('pos', pos); store.set('visited', [...visited]);
  const f = flat[pos], stage = $('#stage');
  stage.style.setProperty('--c', f.s.c);
  stage.innerHTML = '';
  if (f.sc.topic) renderTopic(stage, f.sc.topic, f.s);
  else f.sc.render(stage, f.s);
  $('#where').textContent = f.s.label + ' · about ' + f.s.mins + ' min';
  $('#count').textContent = (pos+1) + ' / ' + flat.length;
  $('#prev').disabled = pos === 0;
  $('#next').textContent = pos === flat.length-1 ? 'Finish ✓' : 'Next →';
  $('#next').disabled = pos === flat.length-1;
  if (MODE === 'trainer'){ $('#ntext').textContent = f.sc.notes || ''; setTimerFor(f.si); }
  renderSteps();
  window.scrollTo({top:0});
}
$('#prev').onclick = () => go(pos-1);
$('#next').onclick = () => go(pos+1);
$('#steps').onclick = e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); };
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowRight') go(pos+1);
  if (e.key === 'ArrowLeft') go(pos-1);
});
const tbtn = $('#trainer');
function setTrainer(on){ tbtn.setAttribute('aria-pressed', on); $('#notes').hidden = !on; store.set('trainer', on); }
tbtn.onclick = () => setTrainer(tbtn.getAttribute('aria-pressed') !== 'true');
if (MODE === 'trainer') setTrainer(store.get('trainer', true));

/* ---------------- timer ---------------- */
let tLeft = 240, tRun = null, tSec = -1;
function fmt(s){ const a = Math.abs(s); return (s<0?'-':'') + Math.floor(a/60) + ':' + String(a%60).padStart(2,'0'); }
function drawT(){ $('#tval').textContent = fmt(tLeft); $('#timer').classList.toggle('over', tLeft < 0); $('#tgo').textContent = tRun ? 'Pause' : 'Start'; }
function setTimerFor(si){ if (si === tSec) return; tSec = si; clearInterval(tRun); tRun = null; tLeft = SECTIONS[si].mins*60; drawT(); }
$('#tgo').onclick = () => { if (tRun){ clearInterval(tRun); tRun = null; } else { tRun = setInterval(() => { tLeft--; drawT(); }, 1000); } drawT(); };
$('#treset').onclick = () => { clearInterval(tRun); tRun = null; tLeft = SECTIONS[tSec].mins*60; drawT(); };

function renderTopic(el, t, s){
  const faces = t.faces || ['AI','Data','Patterns','Predict','Learn','Check'];
  el.innerHTML = `<div class="topic" style="--c:${s.c}"><div class="txt">
    <p class="num">${esc(t.n)}</p><h1>${esc(t.title)}</h1><span class="mins">About ${s.mins} minutes</span>
    <ul>${t.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>
    <div class="cube-wrap" aria-hidden="true"><div class="cube">${faces.map((f,i) => `<span class="f${i+1}">${esc(f)}</span>`).join('')}</div></div></div>`;
}

function howItWorks(el){
  el.innerHTML = `<h2 class="h">Rules or learning? <span class="badge">AI Literacy</span></h2>
   <p class="lead">Both of these sort emails. Only one of them is AI.</p>
   <div class="grid2">
    <div class="card"><p class="tag" style="--c:var(--ink-2)">A normal program</p><h3>Follows rules a person wrote</h3>
     <div class="mono">IF email contains "win money"
THEN move it to Spam</div><p class="note">Clever spammers write "w1n m0ney" and get through.</p></div>
    <div class="card" style="background:var(--blue-soft)"><p class="tag">Artificial intelligence</p><h3>Learns the rules from examples</h3>
     <div class="mono">10,000 emails people marked
"spam" or "not spam"  →  AI finds the patterns itself</div><p class="note">It catches new tricks it was never told about.</p></div>
   </div>
   <h3 style="font-size:24px;margin:26px 0 8px">How AI learns, in three steps</h3>
   <div class="flow" id="flow">
    <div class="fstep"><p class="n">1</p><h3>Examples</h3><p>It is shown huge amounts of data: texts, pictures or sounds, often with labels.</p></div>
    <div class="fstep"><p class="n">2</p><h3>Patterns</h3><p>It notices what usually goes together, like words that appear in spam.</p></div>
    <div class="fstep"><p class="n">3</p><h3>A good guess</h3><p>Given something new, it predicts the most likely answer.</p></div>
   </div>
   <div class="row"><button class="btn accent small" id="fnext" type="button">Show step 1</button></div>
   <div class="callout" id="fdef" hidden><b>In one sentence:</b> AI is software that learns patterns from many examples and uses them to make predictions. It is very good at guessing, but a guess is still a guess, so we always check.</div>`;
  let k = 0; const steps = $$('.fstep', el), btn = $('#fnext', el);
  btn.onclick = () => {
    if (k < 3){ steps[k].classList.add('on'); k++; btn.textContent = k < 3 ? 'Show step ' + (k+1) : 'Show the one-sentence definition'; }
    else { $('#fdef', el).hidden = false; btn.hidden = true; }
  };
}

function nextWord(el){
  const R = [
   {s:'Good morning, ___', opts:[['everyone',34],['class',24],['children',17],['teacher',9],['sunshine',3]]},
   {s:'Please open your books to page ___', opts:[['10',12],['1',9],['5',8],['20',6],['one',4]]},
   {s:'Twinkle, twinkle, little ___', opts:[['star',96],['bat',1],['light',1],['one',0.5],['eyes',0.3]]},
   {s:'The capital of Australia is ___', opts:[['Canberra',71],['Sydney',22],['Melbourne',5],['a',1],['not',1]], twist:'Notice Sydney: lots of text online links "Australia" and "Sydney", so a wrong answer still gets a high score. This is how AI can sound confident and still be wrong.'}
  ];
  let r = 0;
  const draw = () => {
    const q = R[r];
    el.innerHTML = `<h2 class="h">Think like an AI: guess the next word</h2>
     <p class="lead">Tools like ChatGPT write one word at a time. Each time, they pick a word that is likely to come next. Let's do it ourselves.</p>
     <p class="tag">Round ${r+1} of ${R.length}</p>
     <p class="sent">${esc(q.s).replace('___','<u>&nbsp;?&nbsp;</u>')}</p>
     <form class="guess" id="gform"><input id="gin" type="text" placeholder="The group's guess" aria-label="The group's guess" autocomplete="off"><button class="btn accent small" type="submit">Reveal what an AI would pick</button></form>
     <div class="probs" id="probs"></div><p class="fb" id="gfb"></p>
     <div class="row"><button class="btn ghost small" id="gnext" type="button" hidden>${r < R.length-1 ? 'Next round →' : 'Play again ↺'}</button></div>
     <p class="note">The percentages are illustrative, to show the idea.</p>`;
    $('#gform', el).onsubmit = ev => {
      ev.preventDefault();
      const g = $('#gin', el).value.trim().toLowerCase();
      $('#probs', el).innerHTML = q.opts.map((o,i) => `<div class="prob${i===0?' top':''}"><span class="w">${esc(o[0])}</span><span class="track"><i data-w="${Math.max(o[1],1)}"></i></span><span class="p">${o[1] < 1 ? '<1' : o[1]}%</span></div>`).join('');
      requestAnimationFrame(() => requestAnimationFrame(() => $$('.track i', el).forEach(i => i.style.width = i.dataset.w + '%')));
      const hit = q.opts.findIndex(o => o[0].toLowerCase() === g);
      const fb = $('#gfb', el);
      fb.className = 'fb ' + (hit === 0 ? 'good' : 'bad');
      fb.textContent = (g ? (hit === 0 ? 'You think like an AI: that is its top pick! ' : hit > 0 ? 'Good guess, it is on the list. ' : 'Interesting! The AI ranks other words higher. ') : '') + (q.twist || 'The AI usually picks the most likely word, so it sounds fluent.');
      $('#gnext', el).hidden = false;
    };
    $('#gnext', el).onclick = () => { r = (r+1) % R.length; draw(); };
  };
  draw();
}

function fixPrompt(el){

   ['Role: who the AI should be', /\b(you are|act as|as an? |i am an?|i'm an?)\b/i],

   ['Format: how it should look', /\b(table|list|bullet|numbered|steps|answer key|headings?|columns?|under \d+|words|sentences|lines)\b/i],

  const draw = () => {
    el.innerHTML = `<h2 class="h">Challenge: fix this weak prompt</h2>

     <div class="card" style="background:var(--red-soft)"><p class="tag" style="--c:var(--red)">Weak prompt</p><p class="sent" style="margin:4px 0 0;font-size:28px">“${esc(weak[w])}”</p></div>
     <div class="field" style="margin-top:18px"><label for="fx">Your better prompt</label><textarea id="fx" placeholder="You are a… Create… for Class… Include… Show it as…"></textarea></div>
     <div class="row"><button class="btn accent small" id="fxchk" type="button">Check my prompt</button><button class="btn ghost small" id="fxai" type="button" hidden>Get AI feedback</button></div>
     <ul class="checks" id="fxres"></ul><div class="mono out" id="fxout" hidden style="margin-top:12px"></div>
     <details style="margin-top:18px"><summary style="cursor:pointer;font-weight:700">Show an example answer</summary><div class="mono" style="margin-top:10px">You are an experienced Class 2 teacher. Create a worksheet on farm animals for 7-year-olds with 5 fill-in-the-blank sentences, 1 matching activity and 1 drawing task. Use simple words and add an answer key at the end.</div></details>`;

        `<li><span class="m" style="background:var(--gold-soft);color:var(--ink)">★</span><b>${n} of 5 parts. ${n===5?'Excellent prompt!':n>=3?'Good, add the missing parts to make it great.':'Add more detail: who, for whom, how many, what format.'}</b></li>`;
    };
    samplePromise.then(sample => {
      const ai = $('#fxai', el); if (!sample || !ai) return; ai.hidden = false;
      ai.onclick = async () => {
        const t = $('#fx', el).value.trim(), out = $('#fxout', el); if (!t){ out.hidden = false; out.textContent = 'Write your prompt first.'; return; }
        ai.disabled = true; out.hidden = false; out.textContent = 'Thinking…';
        try {
          await sample(`You are coaching a primary school teacher who is learning to write AI prompts. The original weak prompt was: "${weak[w]}". The teacher's improved prompt is: "${t.slice(0,1500)}". In plain friendly English, give: one sentence of praise, then up to 3 short, specific suggestions, then one improved version of the prompt. Under 120 words. No markdown symbols.`, { modelTier:'quick', cache:false, onText: ({text}) => { out.textContent = text; } });
        } catch (e) {
          out.textContent = (e && e.text) || (e && e.code === 'rate_limited' ? 'Too many requests just now. Wait a minute, then try again.' : 'AI feedback is not available right now. Use the checklist above.');

   <span class="score">Score: <b id="wsc">0</b> / ${Q.length}</span>
   <div class="grid2" id="wq">${Q.map((q,i) => `<div class="qcard"><p class="q">${i+1}. ${esc(q[0])}</p><div class="choices" data-i="${i}" style="flex-direction:column;align-items:stretch">${q[1].map((o,j) => `<button type="button" class="choice" data-v="${j}" style="text-align:left">${esc(o)}</button>`).join('')}</div><p class="why" hidden></p></div>`).join('')}</div>
   <h3 style="font-size:26px;margin:30px 0 8px">Four things to remember</h3>
   <div class="takeaways"><div>AI learns patterns from examples and makes good guesses.</div><div>You already use AI every day: maps, filters, recommendations.</div><div>AI drafts, the teacher decides. Always check before it reaches a child.</div><div>Strong prompts have a role, task, details and format. Never include children’s personal data.</div></div>
   <div class="callout" style="background:var(--green-soft);border-color:var(--green)"><b>Next: Module 2, AI for Daily Teaching Activities.</b> Bring one real topic you will teach next week; we will turn it into a lesson plan, worksheet, story and quiz.</div>`;
  $('#wq', el).onclick = e => {
    const b = e.target.closest('.choice'); if (!b) return;
    const box = b.parentElement, q = Q[+box.dataset.i]; if (box.dataset.done) return; box.dataset.done = 1;
    const ok = +b.dataset.v === q[2]; if (ok) sc++; dn++;
    $$('.choice', box).forEach(x => { if (+x.dataset.v === q[2]) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    const w = box.nextElementSibling; w.hidden = false; w.textContent = q[3];
    $('#wsc', el).textContent = sc;
  };
}

if (MODE !== 'trainer'){ tbtn.remove(); $('#notes').remove(); $('#timer').remove(); }
go(pos);
})();
</script>
